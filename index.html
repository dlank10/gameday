<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Game Day">
<meta name="theme-color" content="#C8102E">
<title>SeamPro Game Day</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#faf7f2; --panel:#ffffff; --soft:#f3eee5; --line:#e3dccd; --line2:#d3cab7;
  --red:#C8102E; --red-d:#8f0c21; --ink:#1c1d20; --muted:#6b6f77;
  --good:#1f7a44; --warn:#b7791f; --cold:#2f6fb0;
  --r:10px;
}
html{color-scheme:light;}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,sans-serif;font-size:15px;min-height:100vh;}
.cd{font-family:'Barlow Condensed','Arial Narrow',sans-serif;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
button svg,button span,button i,button small{pointer-events:none;}
header.top{touch-action:manipulation;}
.iconbtn{width:44px;height:44px;}
input,select,textarea{font:inherit;color:var(--ink);}
input,select,textarea{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%;}
textarea{resize:vertical;min-height:64px;line-height:1.35;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent;}

/* shell */
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.02em;}
.brand b{color:var(--red);}
.brand small{font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-left:6px;}
.spacer{flex:1;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:99px;padding:5px 10px;}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa;}
.dot.ok{background:var(--good);} .dot.syncing{background:var(--warn);} .dot.offline{background:#999;} .dot.error{background:var(--red);}
.iconbtn{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--soft);}
main{max-width:1180px;margin:0 auto;padding:16px 16px 96px;}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);}
nav.tabs button{padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
nav.tabs button svg{width:22px;height:22px;}
nav.tabs button.on{color:var(--red);}
nav.tabs .live{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;margin-left:4px;vertical-align:middle;animation:pulse 1.4s infinite;}
@keyframes pulse{50%{opacity:.3}}

h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;line-height:1.05;letter-spacing:.01em;}
h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.02em;}
.eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;}
.sub{color:var(--muted);font-size:13px;}
.row{display:flex;align-items:center;gap:10px;}
.wrap{flex-wrap:wrap;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;}
.stack>*+*{margin-top:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:820px){.grid2{grid-template-columns:1fr;}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:10px 14px;font-weight:700;
  background:var(--soft);border:1px solid var(--line);min-height:42px;}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;}
.btn.ghost{background:transparent;}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;}
.btn.block{width:100%;}
.btn:disabled{opacity:.45;cursor:default;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.muted{color:var(--muted);}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:var(--soft);color:var(--muted);}
.tag.red{background:#fbe3e6;color:var(--red-d);}
.tag.green{background:#e2f2e8;color:var(--good);}
.empty{text-align:center;padding:36px 16px;color:var(--muted);}
.empty h2{color:var(--ink);margin-bottom:6px;}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0;}
label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;}
table.t th{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.t td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--soft);font-variant-numeric:tabular-nums;}
table.t th:first-child,table.t td:first-child{text-align:left;}
.scroll-x{overflow-x:auto;}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;}
.gate .card{width:100%;max-width:400px;padding:28px 24px;}
.gate input{font-size:22px;text-align:center;letter-spacing:.2em;text-transform:uppercase;font-weight:700;padding:14px;}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;}

/* staff board */
.pitchers{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;}
.pc{cursor:pointer;}
.pc-head{display:flex;align-items:baseline;gap:8px;}
.pc-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px;}
.pc-num{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--muted);font-size:16px;}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 8px;}
.day{border-radius:7px;background:var(--soft);text-align:center;padding:5px 0 6px;}
.day .dl{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
.day .dn{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;line-height:1.1;min-height:21px;}
.day.today{outline:2px solid var(--ink);outline-offset:-2px;}
.day.l1{background:#fbe3e6;} .day.l2{background:#f4a9b4;} .day.l3{background:#e0455d;color:#fff;} .day.l4{background:#8f0c21;color:#fff;}
.day.l3 .dl,.day.l4 .dl{color:rgba(255,255,255,.8);}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;}
.kv b{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;margin-right:3px;}
.velo-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;}
.vchip{background:var(--soft);border-radius:6px;padding:3px 7px;font-weight:600;font-variant-numeric:tabular-nums;}
.pc-detail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;}
.pc-detail .ln{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--soft);}

/* logger */
.lg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start;}
@media(max-width:900px){.lg{grid-template-columns:1fr;}}
.scorebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.sb-box{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;display:flex;align-items:center;gap:8px;}
.sb-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.sb-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;line-height:1;}
.outs{display:flex;gap:4px;} .outs i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);display:block;}
.outs i.on{background:var(--ink);}
.step{width:30px;height:30px;border-radius:7px;background:var(--soft);font-weight:800;}
.batter{display:flex;align-items:center;gap:12px;}
.bnum{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:34px;color:var(--red);min-width:46px;text-align:center;}
.bname{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:24px;line-height:1;}
.count{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:38px;letter-spacing:.02em;margin-left:auto;text-align:right;line-height:.9;}
.count small{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;}
.pt-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;}
@media(max-width:560px){.pt-grid{grid-template-columns:repeat(5,1fr);}}
.pt{border:2px solid var(--line);background:#fff;border-radius:9px;padding:8px 2px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;text-align:center;position:relative;}
.pt small{display:block;font-family:'Barlow',sans-serif;font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pt.on{color:#fff;border-color:transparent;}
.pt.on small{color:rgba(255,255,255,.85);}
.velo{display:grid;grid-template-columns:44px repeat(10,minmax(0,1fr)) 44px;gap:5px;align-items:stretch;}
.velo .vb{border:2px solid var(--line);background:#fff;border-radius:9px;padding:9px 0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;text-align:center;font-variant-numeric:tabular-nums;}
.velo .vb.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.velo .vs{background:var(--soft);border-radius:9px;font-size:22px;font-weight:800;}
@media(max-width:560px){.velo{grid-template-columns:34px repeat(10,minmax(0,1fr)) 34px;gap:3px;} .velo .vb{font-size:16px;padding:8px 0;border-width:1.5px;}}
.zones{display:grid;grid-template-columns:auto auto;gap:18px;justify-content:start;align-items:start;}
@media(max-width:560px){.zones{grid-template-columns:1fr 1fr;gap:10px;}}
.zwrap{display:inline-block;}
.zlabel{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
.z3{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;}
.z5{display:grid;grid-template-columns:repeat(5,38px);grid-template-rows:repeat(5,38px);gap:3px;}
@media(max-width:560px){.z3{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,44px);} .z5{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,30px);}}
.zc{border-radius:6px;border:1.5px solid var(--line2);background:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--muted);display:grid;place-items:center;}
.z5 .zc.out{background:var(--soft);border-style:dashed;}
.z5 .zc.in{background:#fff;}
.zc.sel{background:var(--ink)!important;color:#fff;border-color:var(--ink);border-style:solid;}
.zc.called{box-shadow:inset 0 0 0 3px var(--red);}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.res{border-radius:10px;padding:13px 6px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;letter-spacing:.02em;border:1px solid var(--line);background:#fff;}
.res.ball{background:#eef4fb;color:#1f4f82;border-color:#cfe0f1;}
.res.str{background:#fbe8ea;color:var(--red-d);border-color:#f1c9cf;}
.res.ip{background:var(--ink);color:#fff;border-color:var(--ink);}
.ipbox{border:2px solid var(--ink);border-radius:12px;padding:12px;background:#fff;}
.outc{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
@media(max-width:560px){.outc{grid-template-columns:repeat(3,1fr);}}
.outc button{border-radius:9px;padding:12px 4px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;background:var(--soft);border:1px solid var(--line);}
.outc button.hit{background:#fbe8ea;color:var(--red-d);border-color:#f1c9cf;}
.toggle{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:9px;border:2px solid var(--line2);font-weight:700;}
.toggle.on{border-color:var(--red);background:#fbe8ea;color:var(--red-d);}
.exec{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:6px 10px;border-radius:8px;background:var(--soft);}
.exec.y{background:#e2f2e8;color:var(--good);} .exec.n{background:#fbe8ea;color:var(--red-d);}
.seq{display:flex;flex-direction:column;gap:5px;}
.seq-i{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--soft);}
.seq-i .n{font-family:'Barlow Condensed',sans-serif;font-weight:800;width:20px;color:var(--muted);}
.ptag{display:inline-block;min-width:34px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;color:#fff;border-radius:5px;padding:1px 5px;}

@media(max-width:560px){
  .scorebar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;} .scorebar>*{min-width:0!important;} .scorebar .sb-box:first-child .sb-val{font-size:16px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .sb-box{padding:6px 8px;gap:6px;} .scorebar .sb-box:first-child>div{min-width:0;overflow:hidden;}
  .scorebar>.sb-box:nth-child(4){grid-column:1/-1;order:5;}
  .scorebar>button{order:6;grid-column:1/-1;}
  .bname{font-size:21px;} .count{font-size:32px;} .bnum{font-size:28px;min-width:36px;}
}
@media(max-width:420px){.brand small{display:none;} .pill{font-size:11px;padding:4px 8px;}}
.z5.big{grid-template-columns:repeat(5,60px);grid-template-rows:repeat(5,52px);gap:4px;}
@media(max-width:560px){.zones{grid-template-columns:1fr;} .z5.big{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,48px);}}
.modal-bg.full{align-items:stretch;padding:0;}
.modal.wide{max-width:none;max-height:none;height:100%;border-radius:0;padding:0 0 calc(24px + env(safe-area-inset-bottom));background:var(--bg);}
.as-top{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.as-sub{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;}
.as-top h2{font-size:22px;}
.as-body{max-width:1180px;margin:0 auto;padding:14px 16px;}
.as-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;}
@media(max-width:400px){.as-grid{grid-template-columns:1fr;}}
.as-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;}
.as-card.due{border:2px solid var(--red);}
.as-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.as-slot{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;color:#fff;background:var(--ink);border-radius:6px;padding:2px 7px;}
.as-slot.red{background:var(--red);}
.as-split{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;}
.as-card .mini .z5{grid-template-columns:repeat(5,26px)!important;grid-template-rows:repeat(5,26px)!important;gap:2px;}
.mini .zc{font-size:11px;border-radius:4px;border-width:1px;color:var(--ink);}
.mix{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.mix span{font-size:12px;font-weight:700;border-radius:5px;padding:2px 6px;color:#fff;}
.as-pa{font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line);}
.as-pa:first-child{border-top:none;}
.as-pa b{font-family:'Barlow Condensed',sans-serif;font-size:14px;}
.as-note{font-size:12.5px;background:#fffbea;border:1px solid #efe2a6;border-radius:7px;padding:6px 8px;margin-bottom:8px;white-space:pre-wrap;}
/* hitter view */
.hv-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;}
.tile .v{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:24px;line-height:1.05;}
.tile .l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.maps{display:grid;grid-template-columns:repeat(3,auto);gap:16px;justify-content:start;}
@media(max-width:820px){.maps{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}}
.map .z5{grid-template-columns:repeat(5,40px);grid-template-rows:repeat(5,40px);}
@media(max-width:560px){.map .z5{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,34px);}}
.map .zc{font-size:12px;color:var(--ink);line-height:1.05;text-align:center;}
.map h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;margin-bottom:2px;}
.legend{font-size:11px;color:var(--muted);margin-top:4px;max-width:220px;}
.pa{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;}
.pa-h{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;}
.pa-seq{display:flex;flex-wrap:wrap;gap:4px;}
.ps{font-size:12px;background:var(--soft);border-radius:6px;padding:3px 6px;white-space:nowrap;}
.note-box{background:#fffbea;border:1px solid #efe2a6;border-radius:9px;padding:10px 12px;font-size:14px;white-space:pre-wrap;}
.insight{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line);}
.insight:last-child{border-bottom:none;}

/* list rows */
.hrow{display:grid;grid-template-columns:54px minmax(0,1fr) 70px auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);}
.hrow:last-child{border-bottom:none;}
.hrow .num input{text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;padding:6px 4px;}
@media(max-width:560px){.hrow{grid-template-columns:48px minmax(0,1fr) 62px;} .hrow .act{grid-column:2/4;}}
.lineup{display:flex;flex-direction:column;gap:5px;}
.lu{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:8px;padding:6px 8px;}
.lu .o{font-family:'Barlow Condensed',sans-serif;font-weight:800;width:18px;color:var(--muted);}
.lu.cur{background:#fbe8ea;}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:700px){.modal-bg{align-items:center;}}
.modal{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
@media(min-width:700px){.modal{border-radius:14px;}}
.modal-h{display:flex;align-items:center;margin-bottom:12px;}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════
const GH_API = 'https://api.github.com';

const PT = [
  {k:'FB', n:'Fastball',    c:'#d23b2a'},
  {k:'2S', n:'2S Fastball', c:'#e57a24'},
  {k:'SI', n:'Sinker',      c:'#b8901a'},
  {k:'CT', n:'Cutter',      c:'#8a5a2e'},
  {k:'SL', n:'Slider',      c:'#2f78bd'},
  {k:'CB', n:'Curveball',   c:'#2a9358'},
  {k:'CH', n:'Changeup',    c:'#8a43aa'},

function put(kind, rec){

}
function remove(kind, id){ const r = db[kind][id]; if(r){ r.deleted = true; put(kind, r); } }
function list(kind, pred){ return Object.values(db[kind]).filter(r=>!r.deleted && (!pred || pred(r))); }

let syncTimer=null, syncing=false, syncState='idle', syncErr='', pollTick=0;
const CORE_KINDS = ['pitchers','teams','hitters','games','throws'];
const ghCfg = () => (meta.gh && meta.gh.repo && meta.gh.token) ? meta.gh : null;
const b64e = str => { const by = new TextEncoder().encode(str); let bin=''; for(let i=0;i<by.length;i+=0x8000) bin += String.fromCharCode.apply(null, by.subarray(i,i+0x8000)); return btoa(bin); };
const b64d = b => { const bin = atob((b||'').replace(/\s/g,'')); const by = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) by[i]=bin.charCodeAt(i); return new TextDecoder().decode(by); };
function queueSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1200); }
async function ghFetch(url, opts){
  const c = ghCfg(); opts = opts || {};
  const res = await fetch(GH_API+url, {method:opts.method||'GET', cache:'no-store', body:opts.body,
    headers:Object.assign({'Authorization':'Bearer '+c.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}, opts.headers||{})});
  if(res.status===401) { const e = new Error('auth'); e.status=401; throw e; }
  return res;
}
const fileUrl = path => '/repos/'+ghCfg().repo+'/contents/'+path;
const fileOf = (kind, rec) => kind==='pitches' ? 'pitches/'+rec.gameId+'.json' : 'core.json';
async function readFile(path, conditional){
  meta.files = meta.files || {};
  const f = meta.files[path] || {};
  const res = await ghFetch(fileUrl(path), {headers: conditional && f.etag ? {'If-None-Match':f.etag} : {}});
  if(res.status===304) return {unchanged:true};
  if(res.status===404) { meta.files[path] = {sha:null, etag:null, at:Date.now()}; return {missing:true}; }
  if(!res.ok){ const e = new Error('GitHub '+res.status); e.status=res.status; throw e; }
  const j = await res.json();
  let data = {};
  try{ data = JSON.parse(b64d(j.content) || '{}'); }catch(e){ data = {}; }
  meta.files[path] = {sha:j.sha, etag:res.headers.get('ETag'), at:Date.now()};
  return {data, sha:j.sha};
}
function mergeIn(data){
  let changed = false;
  Object.keys(data||{}).forEach(kind=>{
    const L = db[kind]; if(!L) return;
    Object.values(data[kind]||{}).forEach(r=>{
      if(!r || !r.id) return;
      const cur = L[r.id];
      if(!cur || (cur.updatedAt||'') < (r.updatedAt||'')){ L[r.id] = r; changed = true; }
    });
  });
  return changed;
}
function snapshotFor(path){
  if(path==='core.json'){ const o = {}; CORE_KINDS.forEach(k=>{ o[k] = db[k]; }); return o; }
  const gid = path.slice(8, -5), o = {};
  Object.values(db.pitches).forEach(p=>{ if(p.gameId===gid) o[p.id] = p; });
  return {pitches:o};
}
async function pushFile(path, keys){
  const stamp = {}; keys.forEach(k=>{ const i=k.indexOf('|'); const r=db[k.slice(0,i)][k.slice(i+1)]; stamp[k] = r ? r.updatedAt : null; });
  for(let attempt=0; attempt<4; attempt++){
    const cur = await readFile(path, false);
    if(cur.data && mergeIn(cur.data)) pendingRenderFromSync = true;
    const body = {message:'Game Day: '+path+' · '+new Date().toISOString(), content:b64e(JSON.stringify(snapshotFor(path)))};
    if(cur.sha) body.sha = cur.sha;
    const res = await ghFetch(fileUrl(path), {method:'PUT', body:JSON.stringify(body), headers:{'Content-Type':'application/json'}});
    if(res.ok){
      const j = await res.json();
      meta.files[path] = {sha:j.content && j.content.sha, etag:null, at:Date.now()};
      meta.outbox = meta.outbox.filter(k=>{
        if(!(k in stamp)) return true;
        const i=k.indexOf('|'); const r=db[k.slice(0,i)][k.slice(i+1)];
        return r && stamp[k]!==null && r.updatedAt!==stamp[k];
      });
      return;
    }
    if(res.status===409 || res.status===422) { await new Promise(r=>setTimeout(r, 300+Math.random()*700)); continue; }
    const e = new Error('GitHub '+res.status); e.status = res.status; throw e;
  }
  throw new Error('Busy, will retry');
}
let pendingRenderFromSync = false;
async function sync(){
  if(syncing){ queueSync(); return; }
  if(!ghCfg()){ syncState='local'; paintSync(); return; }
  if(!navigator.onLine){ syncState='offline'; paintSync(); return; }
  syncing = true; syncState='syncing'; paintSync(); pendingRenderFromSync = false;
  try{
    // push: group waiting changes by file
    const byFile = {};
    meta.outbox.forEach(k=>{
      const i=k.indexOf('|'), kind=k.slice(0,i), r=db[kind] && db[kind][k.slice(i+1)];
      if(!r){ return; }
      const f = fileOf(kind, r); (byFile[f] = byFile[f] || []).push(k);
    });
    meta.outbox = meta.outbox.filter(k=>{ const i=k.indexOf('|'); return db[k.slice(0,i)] && db[k.slice(0,i)][k.slice(i+1)]; });
    for(const f of Object.keys(byFile)) await pushFile(f, byFile[f]);
    // pull: core always; the live game every time; other games when new or changed
    const core = await readFile('core.json', true);
    if(core.data && mergeIn(core.data)) pendingRenderFromSync = true;
    meta.files = meta.files || {};
    const lg = liveGame();
    const want = list('games').filter(g=>{
      const f = meta.files['pitches/'+g.id+'.json'];
      return (lg && g.id===lg.id) || !f || (g.updatedAt||'') > new Date(f.at - 60000).toISOString();
    }).slice(0, 8);
    for(const g of want){
      const r = await readFile('pitches/'+g.id+'.json', true);
      if(r.data && mergeIn(r.data)) pendingRenderFromSync = true;
    }
    meta.lastSync = Date.now(); syncState='ok'; syncErr=''; saveAll();
    if(meta.outbox.length) queueSync();
    if(pendingRenderFromSync) softRender();
  }catch(e){
    syncState='error';
    syncErr = e.status===401 ? 'GitHub key was rejected or expired. Reconnect in Settings.'
      : e.status===403 ? 'GitHub key can\'t write to that repo. It needs Contents: Read and write.'
      : e.status===404 ? 'Repo not found. Check the name and that the key has access to it.'
      : 'Could not reach GitHub. Saved on this device.';
    saveAll();
  }
  syncing = false; paintSync();
}

const pitcherName = id => { const p = get('pitchers',id); return p ? p.name : 'Unknown'; };
const hitterLabel = h => h ? ((h.num?'#'+h.num+' ':'')+h.name) : 'Unknown hitter';
function liveGame(){ return list('games', g=>g.status==='live').sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))[0] || null; }
function gamePitches(gid){ return list('pitches', p=>p.gameId===gid).sort((a,b)=>a.ts-b.ts); }
function effBats(bats, throws){ if(bats==='S') return throws==='L' ? 'R' : (throws==='R' ? 'L' : 'S'); return bats||'?'; }
function sideLabels(eb){ return eb==='R' ? ['IN','AWAY'] : eb==='L' ? ['AWAY','IN'] : ['3B side','1B side']; }
function cellName(c, eb){
  if(c==null) return '—';
  const r = cellR(c), col = cellC(c);
  const H = eb==='R' ? ['Off-In','In','Mid','Away','Off-Away'] : eb==='L' ? ['Off-Away','Away','Mid','In','Off-In'] : ['Off-3B','3B','Mid','1B','Off-1B'];
  const V = ['Above','Up','Mid','Down','Below'];
  if(isInZone(c)){ if(r===2 && col===2) return 'Middle'; return V[r]+'-'+H[col]; }
  const parts = [];
  if(r===0 || r===4) parts.push(r===0?'Above zone':'Below zone');
  else parts.push(V[r]);
  if(col===0 || col===4) parts.push(H[col]); else if(r===0||r===4) parts.push(H[col]);
  return parts.join(' ')+' (chase)';
}
const RES_TXT = {B:'Ball', CS:'Called K', SW:'Whiff', F:'Foul', IP:'In play', HBP:'HBP'};
function pitchResultTxt(p){
  if(p.result==='IP') return (p.out||'In play')+(p.bb?' '+p.bb:'')+(p.hard?' · HARD':'');
  if(p.end==='K') return p.result==='CS' ? 'K looking' : 'K swinging';
  if(p.end==='BB') return 'Walk';
  return RES_TXT[p.result]||p.result;
}

// workload: pitcherId -> date -> {game, other, items:[]}
function workloadMap(){
  const games = db.games, m = {};
  const add = (pid, date, n, item) => {
    if(!pid || !date) return;
    m[pid] = m[pid] || {}; const d = m[pid][date] = m[pid][date] || {game:0, other:0, items:[]};
    if(item.kind==='Game') d.game += n; else d.other += n;
    d.items.push(item);
  };
  const perGame = {};
  list('pitches').forEach(p=>{
    const g = games[p.gameId]; if(!g || g.deleted) return;
    const k = p.pitcherId+'|'+p.gameId;
    perGame[k] = perGame[k] || {pid:p.pitcherId, date:g.date, n:0, g};
    perGame[k].n++;
  });
  Object.values(perGame).forEach(x=>{
    const t = get('teams', x.g.teamId);
    add(x.pid, x.date, x.n, {kind:'Game', n:x.n, label:(x.g.home?'vs ':'@ ')+(t?t.name:'Opponent'), gameId:x.g.id});
  });
  list('throws').forEach(t=>{ add(t.pitcherId, t.date, Number(t.count)||0, {kind:t.kind||'Other', n:Number(t.count)||0, label:t.kind||'Throwing', note:t.note, velo:t.velo, id:t.id}); });
  return m;
}
// velo by outing for a pitcher: [{date, label, avg, max, n}] newest first
function veloOutings(pid){
  const by = {};
  list('pitches', p=>p.pitcherId===pid && FASTBALLS.indexOf(p.type)>=0 && Number(p.velo)>0).forEach(p=>{
    const g = db.games[p.gameId]; if(!g || g.deleted) return;
    by[p.gameId] = by[p.gameId] || {date:g.date, vals:[]};
    by[p.gameId].vals.push(Number(p.velo));
  });
  const out = Object.values(by).map(o=>({date:o.date, avg:avg(o.vals), max:Math.max.apply(null,o.vals), n:o.vals.length, src:'Game'}));
  list('throws', t=>t.pitcherId===pid && Number(t.velo)>0).forEach(t=>out.push({date:t.date, avg:null, max:Number(t.velo), n:0, src:t.kind}));
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}

// hitter stat engine
function hitterPitches(hid, opts){
  opts = opts || {};
  let ps = list('pitches', p=>p.hitterId===hid);
  if(opts.gameId) ps = ps.filter(p=>p.gameId===opts.gameId);
  return ps.sort((a,b)=>a.ts-b.ts);
}
function computeStats(ps, typeFilter){
  const s = {P:0, PA:0, K:0, BB:0, HBP:0, H:0, XBH:0, hard:0, ip:0, sw:0, wh:0, oz:0, ozSw:0, iz:0, izSw:0, fp:0, fpSw:0,
             cells:[], byType:{}, outs:[], damage:[]};
  for(let i=0;i<25;i++) s.cells.push({n:0, sw:0, wh:0, dmg:0, ip:0});
  ps.forEach(p=>{
    // PA-level outcomes count regardless of type filter
    if(p.end){
      s.PA++;
      if(p.end==='K') s.K++; else if(p.end==='BB') s.BB++; else if(p.end==='HBP') s.HBP++;
      if(HITS.indexOf(p.end)>=0){ s.H++; if(p.end!=='1B') s.XBH++; }
    }
    if(typeFilter && typeFilter.indexOf(p.type)<0) return;
    s.P++;
    const swing = p.result==='SW' || p.result==='F' || p.result==='IP';
    const c = p.actual;
    const T = s.byType[p.type] = s.byType[p.type] || {n:0, sw:0, wh:0, oz:0, ozSw:0, ip:0, hard:0, h:0, so:0};
    T.n++;
    if(swing){ s.sw++; T.sw++; }
    if(p.result==='SW'){ s.wh++; T.wh++; }
    if(p.balls===0 && p.strikes===0){ s.fp++; if(swing) s.fpSw++; }
    if(c!=null){
      const C = s.cells[c]; C.n++;
      if(swing) C.sw++;
      if(p.result==='SW') C.wh++;
      if(isInZone(c)){ s.iz++; if(swing) s.izSw++; }
      else { s.oz++; T.oz++; if(swing){ s.ozSw++; T.ozSw++; } }
    }
    if(p.result==='IP'){
      s.ip++; T.ip++;
      const hit = HITS.indexOf(p.out)>=0;
      if(p.hard){ s.hard++; T.hard++; }
      if(hit) T.h++;
      if(c!=null){ s.cells[c].ip++; if(p.hard || hit) s.cells[c].dmg++; }
      if(p.hard || hit) s.damage.push(p);
      else s.outs.push(p);
    }
    if(p.end==='K'){ T.so++; s.outs.push(p); }
  });
  return s;
}
function groupPAs(ps){
  const pas = [], idx = {};
  ps.forEach(p=>{
    if(!(p.paId in idx)){ idx[p.paId] = pas.length; pas.push({paId:p.paId, gameId:p.gameId, pitcherId:p.pitcherId, inning:p.inning, pitches:[]}); }
    pas[idx[p.paId]].pitches.push(p);
  });
  pas.forEach(pa=>{ const last = pa.pitches[pa.pitches.length-1]; pa.end = last.end || null; pa.last = last; });
  return pas;
}
function hitterInsights(hid, eb){
  const ps = hitterPitches(hid);
  const s = computeStats(ps);
  const out = [];
  if(!ps.length) return out;
  // swing & miss by type (min 3 swings)
  const types = Object.keys(s.byType).map(k=>({k, ...s.byType[k]})).filter(t=>t.sw>=3).sort((a,b)=>(b.wh/b.sw)-(a.wh/a.sw));
  if(types.length && types[0].wh>0) out.push({icon:'✦', txt:'Misses most on <b>'+PTM[types[0].k].n+'</b>: '+types[0].wh+' whiffs on '+types[0].sw+' swings ('+pctTxt(types[0].wh,types[0].sw)+').'});
  if(s.oz>=5) out.push({icon:'◎', txt:'Chases <b>'+pctTxt(s.ozSw,s.oz)+'</b> of pitches out of the zone ('+s.ozSw+'/'+s.oz+').'});
  if(s.fp>=3) out.push({icon:'①', txt:'Swings at the first pitch <b>'+pctTxt(s.fpSw,s.fp)+'</b> of the time ('+s.fpSw+'/'+s.fp+').'});
  // hot cell
  let hot=null; s.cells.forEach((c,i)=>{ if(c.dmg>0 && (!hot || c.dmg>hot.dmg)) hot={...c, i}; });
  if(hot) out.push({icon:'🔥', txt:'Damage <b>'+cellName(hot.i, eb)+'</b>: '+hot.dmg+' hit/hard-hit on '+hot.sw+' swings.'});
  // putaway
  const ks = ps.filter(p=>p.end==='K');
  if(ks.length){
    const m = {}; ks.forEach(p=>{ const k = PTM[p.type].n+(p.actual!=null?' '+cellName(p.actual,eb):''); m[k]=(m[k]||0)+1; });
    const top = Object.entries(m).sort((a,b)=>b[1]-a[1])[0];
    out.push({icon:'K', txt:'Strikeout pitch: <b>'+esc(top[0])+'</b>'+(top[1]>1?' ×'+top[1]:'')+'.'});
  }
  return out;
}

// ── STAFF BOARD ─────────────────────────────────────────────
function staffHTML(){
  const today = todayStr();
  const days = []; for(let i=6;i>=0;i--) days.push(addDays(today,-i));
  const wl = workloadMap();
  let ps = list('pitchers', p=>p.active!==false);
  if(!ps.length){
    return '<h1>Staff Board</h1><div class="card empty" style="margin-top:14px;"><h2>No pitchers yet</h2><p>Add your staff to start tracking workload.</p><br>'
      + '<button class="btn pri" data-a="tab" data-v="settings">Add pitchers</button></div>';
  }
  const info = ps.map(p=>{
    const m = wl[p.id] || {};
    const counts = days.map(d=>m[d] ? m[d].game+m[d].other : 0);
    const total = counts.reduce((a,b)=>a+b,0);
    const thrown = counts.filter(n=>n>0).length;
    const dates = Object.keys(m).filter(d=>d<=today && (m[d].game+m[d].other)>0).sort();
    const last = dates[dates.length-1] || null;
    const lastGame = Object.keys(m).filter(d=>m[d].game>0 && d<=today).sort().pop() || null;
    return {p, m, counts, total, thrown, last, lastGame, rest: last ? dayDiff(last, today) : 999};
  });
  const sorters = {
    rest:(a,b)=>b.rest-a.rest || a.p.name.localeCompare(b.p.name),
    load:(a,b)=>b.total-a.total || a.p.name.localeCompare(b.p.name),
    name:(a,b)=>a.p.name.localeCompare(b.p.name)
  };
  info.sort(sorters[ui.staffSort]||sorters.rest);
  const teamTotal = info.reduce((a,x)=>a+x.total,0);
  const threwToday = info.filter(x=>x.counts[6]>0).length;
  let h = '<div class="row wrap" style="justify-content:space-between;align-items:flex-end;">'
    + '<div><h1>Staff Board</h1><div class="sub">'+dowOf(today)+' '+shortDate(today)+' · last 7 days · '+teamTotal+' pitches across the staff · '+threwToday+' threw today</div></div>'
    + '<div class="row"><button class="btn sm" data-a="throwModal">+ Log throwing</button></div></div>';
  h += '<div class="row wrap" style="margin:12px 0;"><span class="sub">Sort</span><div class="chips">'
    + [['rest','Most rest'],['load','Heaviest 7 days'],['name','Name']].map(s=>'<button class="chip '+(ui.staffSort===s[0]?'on':'')+'" data-a="staffSort" data-v="'+s[0]+'">'+s[1]+'</button>').join('')
    + '</div></div>';
  h += '<div class="pitchers">';
  info.forEach(x=>{
    const p = x.p, open = ui.openPitcher===p.id;
    const vo = veloOutings(p.id);
    h += '<div class="card pc" data-a="openPitcher" data-v="'+p.id+'">'
      + '<div class="pc-head"><span class="pc-name">'+esc(p.name)+'</span>'+(p.num?'<span class="pc-num">#'+esc(p.num)+'</span>':'')
      + '<span class="tag">'+(p.throws==='L'?'LHP':'RHP')+'</span><span class="spacer"></span>'
      + (x.counts[6]>0 ? '<span class="tag red">Threw today</span>' : '') + '</div>';
    h += '<div class="week">' + days.map((d,i)=>{
      const n = x.counts[i]; const lvl = n===0?'':n<=20?'l1':n<=40?'l2':n<=60?'l3':'l4';
      return '<div class="day '+lvl+(i===6?' today':'')+'"><div class="dl">'+dowOf(d).slice(0,2)+' '+shortDate(d)+'</div><div class="dn">'+(n||'')+'</div></div>';
    }).join('') + '</div>';
    h += '<div class="kv"><span><b>'+x.total+'</b>pitches</span><span><b>'+x.thrown+'</b>day'+(x.thrown===1?'':'s')+' thrown</span>'
      + '<span><b>'+(x.last? (x.rest===0?'Today':x.rest+'d') : '—')+'</b>'+(x.last && x.rest>0?'since last throw':x.last?'':'no throwing logged')+'</span></div>';
    if(x.lastGame){
      const d = x.m[x.lastGame];
      h += '<div class="sub" style="margin-top:6px;">Last game: '+dowOf(x.lastGame)+' '+shortDate(x.lastGame)+' · '+d.game+' pitches'+(dayDiff(x.lastGame,today)>0?' ('+dayDiff(x.lastGame,today)+'d ago)':'')+'</div>';
    }
    if(vo.length){
      h += '<div class="velo-row"><span class="sub">FB velo</span>' + vo.slice(0,4).map((o,i)=>'<span class="vchip" title="'+esc(o.src)+'">'+shortDate(o.date)+' '
        + (o.avg!=null ? r1(o.avg)+' avg / ' : '') + r1(o.max)+' top</span>').join('') + '</div>';
    }
    if(open){
      h += '<div class="pc-detail">';
      const ds = Object.keys(x.m).filter(d=>d>=days[0] && d<=today).sort().reverse();
      if(!ds.length) h += '<div class="sub">No throwing logged in the last 7 days.</div>';
      ds.forEach(d=>{
        x.m[d].items.forEach(it=>{
          h += '<div class="ln"><span>'+dowOf(d)+' '+shortDate(d)+' · <b>'+esc(it.label)+'</b>'+(it.note?' <span class="muted">— '+esc(it.note)+'</span>':'')+(it.velo?' <span class="muted">· top '+esc(it.velo)+'</span>':'')+'</span>'
            + '<span><b>'+it.n+'</b> P'+(it.id?' <button class="btn sm ghost" data-a="delThrow" data-v="'+it.id+'" aria-label="Delete">✕</button>':'')+'</span></div>';
        });
      });
      h += '<div class="row" style="margin-top:10px;"><button class="btn sm" data-a="throwModal" data-v="'+p.id+'">+ Log throwing for '+esc(p.name.split(' ')[0])+'</button></div>';
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  h += '<p class="sub" style="margin-top:12px;">Game pitches count automatically from the Game logger. Log pens, live ABs, and other throwing with <b>+ Log throwing</b>.</p>';
  return h;
}

function currentCount(g){
  const ps = gamePitches(g.id).filter(p=>p.paId===g.paId);
  let b=0, s=0;
  ps.forEach(p=>{ if(p.result==='B') b++; else if(p.result==='CS'||p.result==='SW') s++; else if(p.result==='F' && s<2) s++; });
  return {b:Math.min(b,3), s:Math.min(s,2), ps};
}

function seqItem(p, i, eb){
  const P = PTM[p.type] || {c:'#888', n:p.type};

    + '<span style="flex:1;">'+esc(cellName(p.actual, eb))+(p.exec===true?' <span class="tag green">hit spot</span>':p.exec===false?' <span class="tag red">missed</span>':'')+'</span>'

function hitterQuickHTML(hit, g, eb){

function paEndTxt(pa){
  const e = pa.end; if(!e) return 'In progress';
  if(e==='K') return pa.last.result==='CS'?'K looking':'K swinging';
  if(e==='BB') return 'Walk'; if(e==='HBP') return 'HBP';
  const p = pa.last; return (e==='OUT'?'Out':e==='ROE'?'Error':e)+(p.bb?' '+p.bb:'')+(p.hard?' · hard':'');
}
function paHTML(pa, eb, showInning){
  const g = get('games', pa.gameId);
  const good = pa.end==='K' || (pa.end==='OUT' && !pa.last.hard);
  const bad = HITS.indexOf(pa.end)>=0 || pa.end==='BB' || pa.end==='HBP' || (pa.last.hard && pa.end);
  return '<div class="pa"><div class="pa-h"><b>'+esc(paEndTxt(pa))+'</b>'+(good?'<span class="tag green">✓</span>':bad?'<span class="tag red">!</span>':'')
    + '<span class="spacer"></span><span class="sub">'+(showInning?'Inn '+pa.inning+' · ':(g?shortDate(g.date)+' · ':''))+esc(pitcherName(pa.pitcherId).split(' ').pop())+'</span></div>'
    + '<div class="pa-seq">'+pa.pitches.map(p=>'<span class="ps"><b style="color:'+(PTM[p.type]?PTM[p.type].c:'#555')+'">'+esc(p.type)+'</b>'+(p.velo?' '+esc(p.velo):'')+' · '+esc(cellName(p.actual,eb).replace(' (chase)','*'))+' · '+esc(p.result==='IP'?(p.out||'IP'):RES_TXT[p.result])+'</span>').join('')+'</div></div>';
}

  // PA history

  h += '<div class="eyebrow">At-bats vs us</div><div class="stack">'+pas.map(pa=>paHTML(pa, eb, false)).join('')+'</div>';
  return h;
}
function maxOf(cells, k){ return Math.max(1, ...cells.map(c=>c[k])); }
function heat(v, kind, n){
  // confidence fades color when sample is tiny
  const conf = n==null ? 1 : Math.min(1, 0.45 + n*0.14);
  const a = Math.max(0.12, Math.min(1, v)) * conf;
  const al = kind==='ink' ? a*0.55 : a*0.85;
  const rgb = kind==='hot' ? '200,16,46' : kind==='cold' ? '47,111,176' : '28,29,32';
  return {bg:'rgba('+rgb+','+al.toFixed(2)+')', dark: al>0.42};
}
function mapHTML(title, cells, fn, sl, legend){
  return '<div class="map"><h3>'+title+'</h3><div class="zlabel"><span>'+sl[0]+'</span><span>'+sl[1]+'</span></div><div class="z5">'
    + cells.map((c,i)=>{ const v = fn(c);
      return '<div class="zc '+(isInZone(i)?'in':'out')+'" style="'+(v?'background:'+v.h.bg+';':'')+(v&&v.h.dark?'color:#fff;':'')+'">'+(v?v.t:'')+'</div>'; }).join('')
    + '</div><div class="legend">'+legend+'</div></div>';
}

// ── ADVANCE SCOUT (between-innings game plan) ───────────────
function advScoutHTML(){
  const g = liveGame();
  if(!g) return '<div class="as-top"><h2 style="flex:1;">Advance Scout</h2><button class="btn pri" data-a="closeModal">Back to tagger</button></div><div class="as-body empty">No live game.</div>';
  const pit = get('pitchers', g.pitcherId);
  const scope = ui.asScope || 'today';
  const todayPs = gamePitches(g.id);
  // batting order starting from the hitter due up
  let order = [];
  if(g.lineup && g.lineup.length){
    const n = g.lineup.length, start = g.lineupIdx||0;
    for(let i=0;i<n;i++) order.push({id:g.lineup[(start+i)%n], slot:((start+i)%n)+1});
  } else {
    const seen = []; todayPs.forEach(p=>{ if(seen.indexOf(p.hitterId)<0) seen.push(p.hitterId); });
    if(g.hitterId && seen.indexOf(g.hitterId)<0) seen.unshift(g.hitterId);
    const ci = seen.indexOf(g.hitterId); const rot = ci>0 ? seen.slice(ci).concat(seen.slice(0,ci)) : seen;
    order = rot.map(id=>({id, slot:null}));
  }
  // anyone who batted today but isn't in the order (pinch hitters already subbed out)
  const inOrder = order.map(o=>o.id);
  const extras = [...new Set(todayPs.map(p=>p.hitterId))].filter(id=>inOrder.indexOf(id)<0);
  const tags = ['At bat','On deck','In the hole'];
  const curPa = currentCount(g).ps.length;
  let h = '<div class="as-top"><div style="flex:1;min-width:180px;"><h2>Advance Scout</h2><div class="sub">Inning '+g.inning+' · '+g.outs+' out · '+esc(pit?pit.name:'')+' · '+todayPs.filter(p=>p.pitcherId===g.pitcherId).length+' P</div></div>'
    + '<button class="btn pri" data-a="closeModal">Back to tagger</button>'
    + '<div class="as-sub"><div class="chips"><button class="chip '+(scope==='today'?'on':'')+'" data-a="asScope" data-v="today">This game</button><button class="chip '+(scope==='all'?'on':'')+'" data-a="asScope" data-v="all">All games vs us</button></div>'
    + '<span class="sub" style="font-size:12px;">Map: darker = more pitches · ✕ whiff · <b style="color:var(--red)">red box</b> = hit or hard hit · * = chase</span></div></div>';
  h += '<div class="as-body"><div class="as-grid">';
  order.forEach((o,i)=>{ h += asCard(o.id, o.slot, i<3 ? (i===0 && curPa ? 'At bat now' : tags[i]) : null, i<3, g, scope, pit); });
  h += '</div>';
  if(extras.length){
    h += '<div class="eyebrow">Also batted today</div><div class="as-grid">' + extras.map(id=>asCard(id, null, null, false, g, scope, pit)).join('') + '</div>';
  }
  if(!order.length && !extras.length) h += '<div class="empty">No hitters yet. Set a lineup or log the first pitch.</div>';
  h += '</div>';
  return h;
}
function asCard(hid, slot, tag, due, g, scope, pit){
  const x = get('hitters', hid);
  if(!x) return '';
  const eb = effBats(x.bats, pit && pit.throws), sl = sideLabels(eb);
  const ps = hitterPitches(hid, scope==='today' ? {gameId:g.id} : null);
  const s = computeStats(ps);
  const pas = groupPAs(ps);
  let h = '<div class="as-card'+(due?' due':'')+'"><div class="as-h">'
    + (slot ? '<span class="as-slot'+(due?' red':'')+'">'+slot+'</span>' : '')
    + '<div style="flex:1;min-width:0;"><b class="cd" style="font-size:20px;">'+esc(hitterLabel(x))+'</b> <span class="muted" style="font-size:12px;">'+esc(eb==='?'?'Bats ?':eb+'HH')+'</span></div>'
    + (tag ? '<span class="tag red">'+tag+'</span>' : '') + '</div>';
  if(x.notes) h += '<div class="as-note">'+esc(x.notes)+'</div>';
  if(!ps.length){ return h + '<div class="sub">'+(scope==='today'?'Hasn\'t batted yet this game.':'No pitches vs us yet.')+'</div></div>'; }
  // pitch mix
  const mix = PT.filter(p=>s.byType[p.k]).map(p=>'<span style="background:'+p.c+'">'+p.k+' '+s.byType[p.k].n+'</span>').join('');
  const maxN = maxOf(s.cells,'n');
  h += '<div class="as-split"><div class="mini map"><div class="zlabel"><span>'+sl[0]+'</span><span>'+sl[1]+'</span></div><div class="z5">'
    + s.cells.map((c,i)=>{ const hh = c.n ? heat(c.n/maxN,'ink') : null; const mark = c.wh ? '✕' : (c.dmg ? '!' : (c.n||''));
        return '<div class="zc '+(isInZone(i)?'in':'out')+'" title="'+esc(cellName(i,eb))+'" style="'+(hh?'background:'+hh.bg+';':'')+(hh&&hh.dark?'color:#fff;':'')+(c.dmg?'box-shadow:inset 0 0 0 2px var(--red);':'')+'">'+mark+'</div>'; }).join('')
    + '</div></div>';
  h += '<div style="min-width:0;"><div class="mix">'+mix+'</div>'
    + '<div class="sub" style="margin-bottom:4px;">'+s.PA+' PA · '+s.P+' P · Whiff '+pctTxt(s.wh,s.sw)+' · Chase '+pctTxt(s.ozSw,s.oz)+'</div>';
  h += pas.map((pa,i)=>{
    const gm = get('games', pa.gameId);
    const lbl = scope==='today' ? ('AB '+(i+1)+' · Inn '+pa.inning) : (gm?shortDate(gm.date):'')+' · AB';
    return '<div class="as-pa"><b>'+esc(paEndTxt(pa))+'</b> <span class="muted">'+lbl+'</span><div>'
      + pa.pitches.map(p=>'<span style="color:'+(PTM[p.type]?PTM[p.type].c:'#555')+';font-weight:700;">'+esc(p.type)+'</span>'+(p.velo?' '+p.velo:'')+' '+esc(shortCell(p.actual,eb))+' '+esc(shortRes(p))).join(' → ')
      + '</div></div>';
  }).join('');
  h += '</div></div></div>';
  return h;
}
function shortCell(c, eb){
  if(c==null) return '';
  const n = cellName(c, eb).replace(' (chase)','*').replace('Above zone','High').replace('Below zone','Dirt');
  return n;
}
function shortRes(p){
  if(p.result==='IP') return '('+(p.out==='OUT'?'out':p.out)+(p.hard?', hard':'')+')';
  if(p.end==='K') return '(K)';
  if(p.end==='BB') return '(BB)';
  return '('+({B:'B',CS:'CS',SW:'whiff',F:'foul',HBP:'HBP'})[p.result]+')';
}

// ROSTER PASTE PARSER
// ════════════════════════════════════════════════════════════
const POS = /^(C|P|RHP|LHP|INF|IF|OF|UT|UTL|DH|1B|2B|3B|SS|LF|CF|RF|MIF|CIF|C\/INF|INF\/OF|OF\/P|INF\/P|C\/OF|RHP\/INF|RHP\/OF|LHP\/OF|LHP\/INF)$/i;
const isPitcherPos = pos => /^(RHP|LHP|P)$/i.test(pos||'');
const STOP = /^(C|P|RHP|LHP|INF|IF|OF|UT|UTL|DH|1B|2B|3B|SS|LF|CF|RF|MIF|CIF|C\/INF|INF\/OF|OF\/P|INF\/P|C\/OF|Pitcher|Catcher|Infielder|Outfielder|Utility|Fr\.?|So\.?|Jr\.?|Sr\.?|Gr\.?|R-?Fr\.?|R-?So\.?|R-?Jr\.?|R-?Sr\.?|Freshman|Sophomore|Junior|Senior|Graduate|Redshirt|lbs\.?|Full|Bio)$/i;
function parseRoster(text){
  const raw = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const lines = [];
  for(let i=0;i<raw.length;i++){
    if(/^#?\d{1,2}$/.test(raw[i]) && raw[i+1] && /[A-Za-z]{2,}/.test(raw[i+1]) && !/^#?\d{1,2}$/.test(raw[i+1])){ lines.push(raw[i]+' '+raw[i+1]); i++; }
    else lines.push(raw[i]);
  }
  const out = [];
  lines.forEach(l=>{
    const btOnly = l.match(/^([RLS])\s*\/\s*([RL])$/i);
    if(btOnly){ const L = out[out.length-1]; if(L && !L.bats){ L.bats = btOnly[1].toUpperCase(); L.throws = btOnly[2].toUpperCase(); } return; }
    const toks = l.replace(/\t/g,' ').split(/\s+/);
    let num=null, parts=[], bats=null, throws=null, pos=null, started=false, done=false;
    toks.forEach(t=>{
      const bt = t.match(/^([RLS])\/([RL])$/i);
      if(bt){ if(!bats){ bats = bt[1].toUpperCase(); throws = bt[2].toUpperCase(); } if(started) done = true; return; }
      const nm = t.match(/^#?(\d{1,2})$/);
      if(nm){ if(num===null){ num = nm[1]; if(started) done = true; } else if(started) done = true; return; }
      if(done) return;
      const clean = t.replace(/,$/,'');
      if(!pos && POS.test(clean)) pos = clean.toUpperCase();
      if(/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’.\-]*,?$/.test(t) && !STOP.test(clean) && parts.length<4){ started = true; parts.push(t); }
      else if(started) done = true;
    });
    if(!parts.length) return;
    if(num===null && !(parts.length>=2 && (pos || bats))) return;   // no number: needs a position or B/T to count as a player line
    let name;
    if(/,$/.test(parts[0])) name = parts.slice(1).join(' ')+' '+parts[0].replace(/,$/,'');
    else name = parts.join(' ');
    name = name.trim();
    if(name.length<2) return;
    out.push({num:num||'', name, bats, throws, pos});
  });
  const seen = new Set();
  return out.filter(r=>{ const k = (r.num||'')+'|'+r.name.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
}

function snapshot(g){ return {hitterId:g.hitterId||null, lineupIdx:g.lineupIdx||0, paId:g.paId, inning:g.inning, outs:g.outs}; }
function advanceHitter(g, dir){
  if(g.lineup && g.lineup.length){
    g.lineupIdx = ((g.lineupIdx||0) + dir + g.lineup.length) % g.lineup.length;
    g.hitterId = g.lineup[g.lineupIdx];
  } else {
    g.hitterId = null;
  }
  g.paId = uid();
}
function logPitch(result, ipOut){
  const g = liveGame(); if(!g) return;
  if(!g.hitterId){ toast('Pick the hitter first'); ui.modal={type:'pickHitter'}; render(); return; }
  const d = ui.draft;
  const cnt = currentCount(g);
  const autoExec = (d.called!=null && d.actual!=null) ? d.called===d.actual : null;
  const p = {
    id:uid(), gameId:g.id, pitcherId:g.pitcherId, hitterId:g.hitterId, paId:g.paId, inning:g.inning,
    type:d.type, velo: d.velo!=='' && !isNaN(Number(d.velo)) ? Number(d.velo) : null,
    called:d.called, actual:d.actual, exec: d.exec!=null ? d.exec : autoExec,
    result, balls:cnt.b, strikes:cnt.s, ts:Date.now(), pre:snapshot(g)
  };
  let end = null, outsAdd = 0;
  if(result==='B' && cnt.b===3) end='BB';
  if((result==='CS'||result==='SW') && cnt.s===2){ end='K'; outsAdd=1; }
  if(result==='HBP') end='HBP';
  if(result==='IP'){ end = ipOut; p.out = ipOut; p.hard = !!d.hard; p.bb = d.bb; if(ipOut==='OUT') outsAdd=1; }
  p.end = end;
  put('pitches', p);
  if(p.velo) meta.lastVelo[g.pitcherId+'|'+d.type] = p.velo;
  if(end){
    g.outs += outsAdd;
    if(g.outs>=3){ g.outs = 0; g.inning++; toast('3 outs · inning '+g.inning); }
    advanceHitter(g, 1);
  }
  put('games', g);
  ui.draft = {type:d.type, velo:'', called:null, actual:null, ip:false, hard:false, bb:null, exec:null};
  saveAll();
  render();
}
function undoLast(){
  const g = liveGame(); if(!g) return;
  const ps = gamePitches(g.id); const last = ps[ps.length-1]; if(!last) return;
  remove('pitches', last.id);
  if(last.pre) Object.assign(g, last.pre);
  put('games', g);
  toast('Removed last pitch');
  render();
}

  },
  quickHitter(){
    const g = liveGame(); const name = document.getElementById('nh-name').value.trim(); if(!name){ toast('Enter a name'); return; }
    const x = put('hitters', {id:uid(), teamId:g.teamId, num:document.getElementById('nh-num').value.trim(), name, bats:'?', notes:''});
    if(g.lineup && g.lineup.length) g.lineup[g.lineupIdx||0] = x.id;
    g.hitterId = x.id; put('games', g); ui.modal = null; render();
  },
  nextHitter(v){ const g = liveGame(); advanceHitter(g, Number(v)); if(!g.hitterId){ ui.modal={type:'pickHitter'}; } put('games', g); render(); },

  ptype(v){ ui.draft.type = v; ui.draft.velo = ''; render(); },
  veloPick(v){ ui.draft.velo = ui.draft.velo===v ? '' : v; render(); },
  veloShift(v){ const g = liveGame(); const k = g.pitcherId+'|'+ui.draft.type; meta.veloStart[k] = Math.max(40, veloStart(g.pitcherId, ui.draft.type) + Number(v)); saveAll(); render(); },
  called(v){ ui.draft.called = ui.draft.called===Number(v) ? null : Number(v); ui.draft.exec = null; render(); },
  actual(v){ ui.draft.actual = ui.draft.actual===Number(v) ? null : Number(v); ui.draft.exec = null; render(); },
  toggleExec(){ const d = ui.draft; const auto = (d.called!=null && d.actual!=null) ? d.called===d.actual : null; const cur = d.exec!=null ? d.exec : auto; d.exec = cur===true ? false : true; render(); },
  result(v){ logPitch(v); },
  ipOpen(){ ui.draft.ip = true; render(); },
  ipCancel(){ ui.draft.ip = false; ui.draft.hard=false; ui.draft.bb=null; render(); },
  hard(){ ui.draft.hard = !ui.draft.hard; render(); },
  bb(v){ ui.draft.bb = ui.draft.bb===v ? null : v; render(); },
  ipResult(v){ logPitch('IP', v); },
  undo(){ undoLast(); },

  follow(){ ui.follow = !ui.follow; render(); },
  hvScope(v){ ui.hvScope = v; render(); },
  hvGroup(v){ ui.hvGroup = v; render(); },

  addPitcher(){
    const name = document.getElementById('np-name').value.trim(); if(!name){ toast('Enter a name'); return; }
    put('pitchers', {id:uid(), name, num:document.getElementById('np-num').value.trim(), throws:document.getElementById('np-throws').value, active:true});
    render(); setTimeout(()=>{ const i=document.getElementById('np-name'); if(i) i.focus(); }, 30);
  },
  pasteStaff(){
    const rows = parseRoster(document.getElementById('staffpaste').value||'');
    if(!rows.length){ toast('Each line needs a number and a name'); return; }
    const ex = list('pitchers');
    let n=0; rows.forEach(r=>{ if(ex.some(p=>p.name.toLowerCase()===r.name.toLowerCase())) return; put('pitchers', {id:uid(), name:r.name, num:r.num, throws: r.throws || 'R', active:true}); n++; });
    toast(n+' pitchers added. Set LHPs below.'); render();
  },
  toggleActive(v){ const p = get('pitchers', v) || db.pitchers[v]; p.active = p.active===false; put('pitchers', p); render(); },
  export(){
    const blob = new Blob([JSON.stringify({exportedAt:new Date().toISOString(), db}, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'SeamPro_GameDay_backup_'+todayStr()+'.json'; a.click();
  },

  closeModal(){ ui.modal = null; render(); },
  bgClose(v, el, e){ if(e.target===el){ ui.modal = null; render(); } },
  txtOk(){ const m = ui.modal; const v = document.getElementById('txtin').value.trim(); ui.modal = null; m.cb(v); render(); },
  confirmOk(){ const m = ui.modal; ui.modal = null; m.cb(); render(); }
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el || !app.contains(el)) return;
  const fn = A[el.dataset.a]; if(!fn) return;
  fn(el.dataset.v, el, e);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && ui.modal){ ui.modal = null; render(); return; }
  if(e.key==='Enter'){ const el = e.target.closest && e.target.closest('[data-enter]'); if(el){ e.preventDefault(); A[el.dataset.enter](); } }
});
const notesTimers = {};
document.addEventListener('input', e=>{
  const el = e.target, k = el.dataset && el.dataset.in; if(!k) return;
  const id = el.dataset.id, i = el.dataset.i;
  if(k==='velo'){ ui.draft.velo = el.value; return; }
  if(k.startsWith('pr-')){ const r = ui.paste.rows[Number(i)]; if(k==='pr-num') r.num = el.value; if(k==='pr-name') r.name = el.value; return; }
  if(k==='h-notes' || k==='h-name' || k==='h-num' || k==='p-name' || k==='p-num'){
    clearTimeout(notesTimers[k+id]);
    notesTimers[k+id] = setTimeout(()=>{
      const kind = k[0]==='h' ? 'hitters' : 'pitchers';
      const r = get(kind, id); if(!r) return;
      const f = k.slice(2); r[f] = el.value; put(kind, r);
    }, 500);
  }
});
document.addEventListener('change', e=>{
  const el = e.target, k = el.dataset && el.dataset.in; if(!k) return;
  const id = el.dataset.id, i = el.dataset.i;
  if(k==='teamSel'){ ui.teamId = el.value; ui.paste=null; saveUI(); render(); }
  else if(k==='pr-on'){ ui.paste.rows[Number(i)].on = el.checked; }
  else if(k==='pr-bats'){ ui.paste.rows[Number(i)].bats = el.value; }
  else if(k==='h-bats'){ const r = get('hitters', id); r.bats = el.value; put('hitters', r); }
  else if(k==='p-throws'){ const r = get('pitchers', id); r.throws = el.value; put('pitchers', r); }
  else if(k==='sf-date'){ ui.sf.date = el.value; }
  else if(k==='sf-team'){ ui.sf.teamId = el.value; ui.sf.lineup = []; render(); }
  else if(k==='sf-pitcher'){ ui.sf.pitcherId = el.value; render(); }
  else if(k==='hv-team'){ ui.teamId = el.value; ui.hitterId = null; ui.follow = false; saveUI(); render(); }
  else if(k==='hv-hitter'){ ui.hitterId = el.value || null; const g = liveGame(); ui.follow = !!(g && g.hitterId===ui.hitterId); render(); }
  else if(k==='velo'){ ui.draft.velo = el.value; }
  else if(k==='import'){
    const f = el.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const d = JSON.parse(rd.result).db; let n=0;
        KINDS.forEach(kd=>{ Object.values(d[kd]||{}).forEach(r=>{ const cur = db[kd][r.id]; if(!cur || (cur.updatedAt||'')<(r.updatedAt||'')){ db[kd][r.id]=r; const key=kd+'|'+r.id; if(meta.outbox.indexOf(key)<0) meta.outbox.push(key); n++; } }); });
        saveAll(); queueSync(); toast('Restored '+n+' records'); render();
      }catch(err){ toast('That file is not a Game Day backup'); }
    };
    rd.readAsText(f);
  }
});

// ════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════
loadAll();
readSetupLink();
render();
sync();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
